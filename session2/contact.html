<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="">
</head>

<body>
    <form action="about.html" autocomplete="off" method="post">
        <div>
            <label>First Name :</label>
            <input type="text" autofocus autocomplete="off" name="firstName" required
                placeholder="enter your first Name">
        </div>
        <div>
            <label>last Name : </label>
            <input type="text" id="userLastName" name="lastName">

        </div>
        <div>
            <h2>Lorem ipsum dolor sit amet consectetur adipisicing elit. Amet, vel.</h2>
            <!-- userName@domain.subdomain -->
            <label for="userEmail">Email</label>
            <input type="email" id="userEmail" name="userEmail">
        </div>
        <div>

            <label for="">Shipping Area</label>
            <input type="text" name="shipping" value="Alex" disabled>
            <input type="text" name="shippingArea" value="Alex" readonly>
        </div>

        <div>
            <input type="password" placeholder="enter your password">
        </div>

        <div>
            <label for="">Gender</label>
            <input type="radio" name="gender" value="0"> <label>Male</label>
            <input type="radio" name="gender" value="1"> <label>Female</label>
        </div>


        <div>
            <label for="">courses</label>
            <input type="checkbox" name="courses[]" value="html"> <label>Html</label>
            <input type="checkbox" name="courses[]" value="css"> <label>Css</label>
            <input type="checkbox" name="courses[]" value="js"> <label>Js</label>
            <input type="checkbox" name="courses[]" checked value="bootstrap"> <label>Bootstrap</label>
        </div>

        <div>
            <label for="">Age</label>
            <input type="number" name="userAge" min="5" max="10">
        </div>

        <!-- <label for="">tracks</label> -->

        <select name="track" id="">
            <option value="10" disabled selected>please choose your track</option>
            <option value="0">Frontend</option>
            <option value="1">Backend</option>
            <option value="2">Network</option>
            <option value="3">Mobile</option>
        </select>
        <select name="track" id="" multiple>
            <option value="10" disabled selected>please choose your track</option>
            <option value="0">Frontend</option>
            <option value="1">Backend</option>
            <option value="2">Network</option>
            <option value="3">Mobile</option>
        </select>


        <input type="file" name="userFile" multiple>
        <br>

        <input type="text" pattern="[A-Za-z]{3,5}" title="enter only 1 uppercase letter">
        <input type="text" pattern="[A-Za-z]+" title="enter only 1 uppercase letter">
        <input type="text" pattern="[0-9]+" title="enter only numbers">

        <div>
            <label for="website">Homepage:</label>
            <input type="url" id="website" name="website" pattern="https?://.+" title="Include http://">
        </div>

        <div>
            <input type="date" name="userDate">
            <input type="datetime-local">
            <input type="month">
        </div>
        <input type="color">
        <!-- step ==> search -->
        <input type="range" name="range" min="200" max="400" value="200">

        <div>
            <label for="">ID</label>
            <input type="text" minlength="10" maxlength="14">
        </div>

        <div>
            <textarea name="userComment" id="" placeholder="enter your comment" cols="50" rows="4"></textarea>
        </div>




        <input type="submit" value="login">
        <button type="submit">Register</button>

        <input type="reset" value="clear Data">
        <button type="reset">Clear Info</button>

    </form>


    <!-- datalist ==> search -->
    <!-- input file ==> images ==> .png -->
    <!--input - text ==>  mobile  11 number , start with 010/012/015 -->
    <!-- feildset , legend ==> search -->
     





    <script></script>
</body>

</html>
